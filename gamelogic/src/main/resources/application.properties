spring.application.name=gamelogic
server.port=8082
services.lobby.url=${LOBBY_URL:http://localhost:8081}
grpc.client.user-service.address=${USER_GRPC_ADDRESS:static://localhost:9090}
grpc.client.user-service.negotiationType=plaintext
# MongoDB comes in transitively via the lib module but is never used here.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
