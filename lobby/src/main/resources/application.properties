spring.application.name=lobby
server.port=8081
services.gamelogic.url=${GAMELOGIC_URL:http://localhost:8082}
# MongoDB comes in transitively via the lib module but is never used here.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
services.internal.token=${SERVICE_TOKEN:chronocritters-dev-service-token}
# A disconnect mid-battle is a refresh or a flaky phone more often than it is a
# player quitting, so the forfeit waits this long for them to come back.
battle.reconnect-grace-seconds=${RECONNECT_GRACE_SECONDS:30}
