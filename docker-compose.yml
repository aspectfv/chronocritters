services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  user:
    build:
      context: .
      args:
        SERVICE: user
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/chronocritters}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
        # Not required, so the bundled database can be scaled to zero when
        # MONGODB_URI points at a managed instance instead.
        required: false

  lobby:
    build:
      context: .
      args:
        SERVICE: lobby
    restart: unless-stopped
    environment:
      GAMELOGIC_URL: http://gamelogic:8082
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gamelogic:
    build:
      context: .
      args:
        SERVICE: gamelogic
    restart: unless-stopped
    environment:
      LOBBY_URL: http://lobby:8081
      USER_GRPC_ADDRESS: static://user:9090
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      # The first thing a battle does is fetch both rosters over gRPC, so
      # gamelogic waits for the user service to answer rather than for its
      # container to exist.
      user:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      user:
        condition: service_healthy
      lobby:
        condition: service_healthy
      gamelogic:
        condition: service_healthy

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
