syntax = "proto3";

package chronocritters.player;

option java_package = "com.chronocritters.proto.player";
option java_outer_classname = "PlayerProto";

enum CritterTypeProto {
  CRITTER_TYPE_UNSPECIFIED = 0;
  FIRE = 1;
  WATER = 2;
  GRASS = 3;
  ELECTRIC = 4;
  METAL = 5;
  TOXIC = 6;
  KINETIC = 7;
}

service PlayerService {
  rpc GetPlayer(PlayerRequest) returns (PlayerResponse);
  rpc UpdateMatchHistory(MatchHistoryRequest) returns (MatchHistoryResponse);
  rpc GetBattleRewards(BattleRewardsRequest) returns (BattleRewardsResponse);
}

message PlayerRequest {
  string player_id = 1;
}

message PlayerResponse {
  string id = 1;
  string username = 2;
  repeated CritterProto roster = 4;
}

message CritterProto {
  string id = 1;
  string name = 2;
  string description = 3;
  CritterTypeProto type = 6;
  BaseStatsProto base_stats = 7;
  repeated AbilityProto abilities = 8;
}

message BaseStatsProto {
  int32 health = 1;
  int32 attack = 2;
  int32 defense = 3;
  int32 speed = 4;

  // Battle stats are scaled by level, so gamelogic needs it. Levelling used to
  // change nothing in a battle because this never crossed the wire.
  int32 level = 5;
}

message AbilityProto {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated EffectProto effects = 4;
  int32 cooldown_turns = 5;
}

message EffectProto {
  reserved 5;
  reserved "skip_turn_effect";

  string id = 1;
  string description = 2;
  oneof effect_data {
    DamageEffectProto damage_effect = 3;
    DamageOverTimeEffectProto damage_over_time_effect = 4;
    StatModifierEffectProto stat_modifier_effect = 6;
    HealEffectProto heal_effect = 7;
    LifestealEffectProto lifesteal_effect = 8;
    ShieldEffectProto shield_effect = 9;
    CleanseEffectProto cleanse_effect = 10;
    StatusEffectProto status_effect = 11;
    PriorityEffectProto priority_effect = 12;
  }
}

message DamageEffectProto {
  int32 damage = 1;
}

message DamageOverTimeEffectProto {
  int32 damage_per_turn = 1;
  int32 duration = 2;
}

enum StatProto {
  STAT_UNSPECIFIED = 0;
  ATTACK = 1;
  DEFENSE = 2;
  SPEED = 3;
}

message StatModifierEffectProto {
  StatProto stat = 1;
  int32 stages = 2;
}

message HealEffectProto {
  int32 heal_percent = 1;
}

message LifestealEffectProto {
  int32 damage = 1;
  int32 drain_percent = 2;
}

message ShieldEffectProto {
  int32 amount = 1;
  int32 duration = 2;
}

message CleanseEffectProto {
}

message PriorityEffectProto {
}

enum StatusConditionProto {
  STATUS_CONDITION_UNSPECIFIED = 0;
  BURN = 1;
  POISON = 2;
  PARALYSIS = 3;
  SLEEP = 4;
}

message StatusEffectProto {
  StatusConditionProto condition = 1;
  int32 duration = 2;
  int32 potency = 3;
}

message MatchHistoryRequest {
  string battle_id = 1;
  string winner_id = 2;
  string loser_id = 3;
  BattleStatsProto battle_stats = 4;
  repeated string winner_critter_ids = 5;
  repeated string loser_critter_ids = 6;
}

message TurnActionEntryProto {
  string player_id = 1;
  bool player_has_turn = 2;
  int32 turn = 3;
  string turnActionLog = 4;
}

message BattleStatsProto {
  int32 turn_count = 1;
  int64 battleStartTime = 2;
  int64 duration = 3;
  map<string, int32> players_damage_dealt = 4;
  repeated TurnActionEntryProto turn_action_history = 5;
}

message MatchHistoryResponse {}

message BattleRewardsRequest {
  string winner_id = 1;
  string loser_id = 2;
  repeated string winner_critter_ids = 3;
  repeated string loser_critter_ids = 4;
}

message BattleRewardsResponse {
  map<string, int64> players_exp_gained = 1;
  map<string, int64> critters_exp_gained = 2;
}